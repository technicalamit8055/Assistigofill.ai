[build]
  command = "npm run build:web"
  publish = "apps/web/.next"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_DB_URL,SUPABASE_SERVICE_ROLE_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,FIELD_ENCRYPTION_KEY,JOB_RUNNER_SECRET,ANTHROPIC_API_KEY"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

