# Local development configuration for Assistigo.ai
# https://supabase.com/docs/guides/cli/config

project_id = "assistigo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# 15 MB — matches MAX_UPLOAD_BYTES in packages/core/src/documents/types.ts
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only. Production requires verified email (docs/SECURITY.md §4).
enable_confirmations = false
secure_password_change = true

[auth.email.template.invite]
subject = "You have been invited to an Assistigo workspace"

[analytics]
enabled = false
